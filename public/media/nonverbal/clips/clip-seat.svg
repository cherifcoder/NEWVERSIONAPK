<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs><style>
    .fig { opacity: 0; }
    
      .fr0 { animation: fr0 6s infinite; }
      @keyframes fr0 {
        0% { opacity: 0; } 0% { opacity: 0; }
        6% { opacity: 1; }
        44% { opacity: 1; }
        50% { opacity: 0; } 100% { opacity: 0; }
      }

      .fr1 { animation: fr1 6s infinite; }
      @keyframes fr1 {
        0% { opacity: 0; } 50% { opacity: 0; }
        56% { opacity: 1; }
        94% { opacity: 1; }
        100% { opacity: 0; } 100% { opacity: 0; }
      }
    .dt0 { opacity: 0.25; animation: dt0 6s infinite; }
      @keyframes dt0 { 0%,0% { opacity: 0.25; } 3.33% { opacity: 1; } 50%,100% { opacity: 0.25; } }
.dt1 { opacity: 0.25; animation: dt1 6s infinite; }
      @keyframes dt1 { 0%,50% { opacity: 0.25; } 53.33% { opacity: 1; } 100%,100% { opacity: 0.25; } }
    .bar { animation: bar 6s linear infinite; }
    @keyframes bar { from { width: 0; } to { width: 64px; } }
  </style></defs>
