    <path d="M66 24 A 20 20 0 0 1 62 60" stroke="rgba(207,168,81,0.28)" stroke-dasharray="3 3"/>
  </g>
  <circle cx="86" cy="53" r="1.6" fill="#cfa851"/>
  <g stroke="#cfa851" fill="none" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.75">
    <line x1="14" y1="88" x2="44" y2="88"/>
  </g>
  <path d="M44 88 l-4 -2.6 v5.2 z" fill="#cfa851" opacity="0.8"/>
    <line x1="49.55" y1="24.8" x2="50" y2="88"
         stroke="#cfa851" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.7"/>
       <line x1="41.55" y1="32.2" x2="57.55" y2="32.2"
