    <line x1="6" y1="88" x2="94" y2="88" stroke="rgba(207,168,81,0.22)" stroke-width="1.6"/>
    <!-- membres éloignés (arrière-plan) -->
    <polyline points="47.8,58 47.05,68.77 46.86,79.57" fill="none" stroke="rgba(244,241,234,0.42)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="44.46,79.57 49.66,79.57" fill="none" stroke="rgba(244,241,234,0.42)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="44.7,41.09 43.4,50.4 41.27,58.94" fill="none" stroke="rgba(244,241,234,0.42)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="41.27" cy="58.94" r="1.7" fill="rgba(244,241,234,0.42)" />
    <!-- buste + tête -->
    <polyline points="49.7,41 50,58" fill="none" stroke="#f4f1ea" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="49.55" cy="32.2" r="5.4" fill="none" stroke="#f4f1ea" stroke-width="3.432"/>
    <!-- membres proches (premier plan) -->
    <polyline points="52.2,58 53.89,68.67 54.45,79.45" fill="none" stroke="#f4f1ea" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="51.85,79.45 57.65,79.45" fill="none" stroke="#f4f1ea" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="54.7,40.92 57.29,49.95 60.87,57.99" fill="none" stroke="#f4f1ea" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" />
