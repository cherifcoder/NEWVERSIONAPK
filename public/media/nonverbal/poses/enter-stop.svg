  </g>
  <text x="50" y="8" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="6" fill="#f7ecd0">Entrer et s'arrêter</text>
  <text x="50" y="13.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="3.4" fill="#9aa0b5">Franchir le seuil, faire deux pas, s'arrêter net au centre. On te voit.</text>
