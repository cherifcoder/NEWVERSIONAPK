<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="900" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0d16"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.1" r="0.7">
      <stop offset="0%" stop-color="#cfa851" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#cfa851" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <rect width="100" height="100" fill="url(#halo)"/>
  
  <g>
    
  <g stroke="#cfa851" fill="none" stroke-width="1.6" stroke-dasharray="3 3" opacity="0.8">
    <line x1="56" y1="30" x2="86" y2="30"/>
  </g>
  <circle cx="88" cy="30" r="2.2" fill="#cfa851" />
    
    <line x1="6" y1="88" x2="94" y2="88" stroke="rgba(207,168,81,0.22)" stroke-width="1.6"/>
    <!-- membres éloignés (arrière-plan) -->
    <polyline points="47.8,58 46.86,68.76 46.48,79.55" fill="none" stroke="rgba(244,241,234,0.42)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="44.08,79.55 49.28,79.55" fill="none" stroke="rgba(244,241,234,0.42)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="43.83,41.39 41.87,50.58 38.86,58.85" fill="none" stroke="rgba(244,241,234,0.42)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="38.86" cy="58.85" r="1.7" fill="rgba(244,241,234,0.42)" />
    <!-- buste + tête -->
    <polyline points="48.81,41.04 50,58" fill="none" stroke="#f4f1ea" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="48.2" cy="32.26" r="5.4" fill="none" stroke="#f4f1ea" stroke-width="3.432"/>
    <!-- membres proches (premier plan) -->
    <polyline points="52.2,58 53.14,68.76 53.52,79.55" fill="none" stroke="#f4f1ea" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="50.92,79.55 56.72,79.55" fill="none" stroke="#f4f1ea" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="53.8,40.69 62.84,43.28 71.59,42.36" fill="none" stroke="#f4f1ea" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="71.59" cy="42.36" r="1.9" fill="#cfa851" />
  </g>
  <text x="50" y="8" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="6" fill="#f7ecd0">Serrer une main</text>
  <text x="50" y="13.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="3.4" fill="#9aa0b5">Regard direct, deux secousses, pression ferme et brève. Tu relâches le premier.</text>
