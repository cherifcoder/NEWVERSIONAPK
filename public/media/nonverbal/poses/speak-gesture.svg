<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="900" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0d16"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.1" r="0.7">
      <stop offset="0%" stop-color="#cfa851" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#cfa851" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <rect width="100" height="100" fill="url(#halo)"/>
  
  <g>
    
  <g stroke="rgba(154,160,181,0.55)" fill="none" stroke-width="2.6" stroke-linejoin="round">
    <path d="M74 50 l12 -6 v42 h-12 z"/>
  </g>
    
    <line x1="6" y1="88" x2="94" y2="88" stroke="rgba(207,168,81,0.22)" stroke-width="1.6"/>
    <!-- membres éloignés (arrière-plan) -->
    <polyline points="47.8,58 46.48,68.72 45.92,79.5" fill="none" stroke="rgba(244,241,234,0.42)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="43.52,79.5 48.72,79.5" fill="none" stroke="rgba(244,241,234,0.42)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="44.12,41.28 40,49.73 33.88,56.06" fill="none" stroke="rgba(244,241,234,0.42)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="33.88" cy="56.06" r="1.7" fill="rgba(244,241,234,0.42)" />
    <!-- buste + tête -->
    <polyline points="49.11,41.02 50,58" fill="none" stroke="#f4f1ea" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="48.34" cy="32.26" r="5.4" fill="none" stroke="#f4f1ea" stroke-width="3.432"/>
    <!-- membres proches (premier plan) -->
    <polyline points="52.2,58 53.52,68.72 54.08,79.5" fill="none" stroke="#f4f1ea" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="51.48,79.5 57.28,79.5" fill="none" stroke="#f4f1ea" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="54.1,40.76 62.08,45.74 70.68,47.57" fill="none" stroke="#f4f1ea" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="70.68" cy="47.57" r="1.9" fill="#cfa851" />
  </g>
  <text x="50" y="8" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="6" fill="#f7ecd0">Prise de parole</text>
  <text x="50" y="13.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="3.4" fill="#9aa0b5">Une idée, un geste. La main ponctue la fin de la phrase, puis retombe.</text>
