name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Locate Android SDK
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ] || [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK" /usr/local/lib/android /opt/android-sdk "$HOME/Android" \
              -name sdkmanager -type f 2>/dev/null | head -n1 || true)"
          fi
          if [ -z "$SDKMGR" ]; then
            echo "::error::sdkmanager introuvable — SDK Android absent du runner"
            ls -la "$SDK" 2>/dev/null || true
            exit 1
          fi
          echo "Using sdkmanager: $SDKMGR"
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync web bundle into Android project
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk METHOD-1.0.0.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: METHOD-1.0.0-apk
          path: METHOD-1.0.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: METHOD ${{ github.ref_name }}
          files: METHOD-1.0.0.apk
          generate_release_notes: true
