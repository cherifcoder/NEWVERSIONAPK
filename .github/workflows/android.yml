name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDK used: $SDK"

          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            for c in \
              "$SDK/cmdline-tools/latest/bin/sdkmanager" \
              "$SDK/cmdline-tools/bin/sdkmanager" \
              "$SDK/tools/bin/sdkmanager"; do
              if [ -x "$c" ]; then SDKMGR="$c"; break; fi
            done
          fi

          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager absent — installation des command-line tools"
            curl -sSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q -o /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
            rm -rf "$SDK/cmdline-tools/latest"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Using sdkmanager: $SDKMGR"
          echo "SDKMGR=$SDKMGR" >> "$GITHUB_ENV"
          timeout 300 bash -c "yes | '$SDKMGR' --sdk_root='$SDK' --licenses > /dev/null 2>&1" || true
          timeout 900 "$SDKMGR" --sdk_root="$SDK" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0" || true
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync web bundle into Android project
        run: npx cap sync android

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk METHOD-1.0.0.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: METHOD-1.0.0-apk
          path: METHOD-1.0.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: METHOD ${{ github.ref_name }}
          files: METHOD-1.0.0.apk
          generate_release_notes: true
